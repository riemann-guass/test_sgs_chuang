name = "sgslean"
defaultTargets = ["SgsLean"]

[leanOptions]
pp.unicode.fun = true
experimental.module = true

# reap 必须排在 mathlib 之前（P1.2 引入 mathlib 时同理）：
# SgsLean 直接复用 reap 的 `evalTacticStrNoFinalCheck` / `checkProof` / `checkTacticSyntax`。
[[require]]
name = "reap"
path = "../reap-fork"

[[lean_lib]]
name = "SgsLean"

[[lean_lib]]
name = "SgsLean.Test"

# python 侧唯一入口（协议见 docs/implementation-blueprint.md）：
#   lake build sgslean-server && .lake/build/bin/sgslean-server.exe < requests.jsonl
# supportInterpreter：本进程内嵌 Lean frontend 跑 elaboration，解释器必需的
# Init/Std/Lean 原生实现要一起链进来，否则报 `Could not find native implementation
# of external declaration 'UInt64.ofNatLT'`。
[[lean_exe]]
name = "sgslean-server"
root = "SgsLean.Server"
supportInterpreter = true
