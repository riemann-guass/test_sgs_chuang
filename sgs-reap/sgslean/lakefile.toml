name = "sgslean"
defaultTargets = ["SgsLean"]

[leanOptions]
pp.unicode.fun = true
experimental.module = true

# reap 必须排在 mathlib 之前（P1.2 引入 mathlib 时同理）：
# SgsLean 直接复用 reap 的 `evalTacticStrNoFinalCheck` / `checkProof` / `checkTacticSyntax`。
[[require]]
name = "reap"
path = "../reap-fork"

[[lean_lib]]
name = "SgsLean"

[[lean_lib]]
name = "SgsLean.Test"
